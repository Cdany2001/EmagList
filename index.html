<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BF List vs eMag</title>
<meta name="description" content="34,083 Black Friday list prices compared with live eMag prices. Filter, tag, wishlist and compare.">
<meta name="theme-color" content="#1C2140">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M6 30 30 6h24a4 4 0 0 1 4 4v24L34 58a4 4 0 0 1-6 0L6 36a4 4 0 0 1 0-6z' fill='%23FFD23F' stroke='%231C2140' stroke-width='4'/%3E%3Ccircle cx='44' cy='20' r='5' fill='%231C2140'/%3E%3C/svg%3E">
<link rel="preload" href="data/index.json" as="fetch" type="application/json" crossorigin>
<link rel="preload" href="data/c0.json" as="fetch" type="application/json" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brandmark" href="#/catalog" aria-label="Catalog">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M6 30 30 6h24a4 4 0 0 1 4 4v24L34 58a4 4 0 0 1-6 0L6 36a4 4 0 0 1 0-6z"/><circle cx="44" cy="20" r="5"/></svg>
    <span>BF list <em>vs</em> eMag</span>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Search 34,083 products, brands, tags" autocomplete="off" enterkeyhint="search">
  </div>
  <nav class="views" aria-label="Views">
    <a href="#/catalog" data-view="catalog">Catalog</a>
    <a href="#/wishlists" data-view="wishlists">Wishlists <b id="wlCount"></b></a>
    <a href="#/compare" data-view="compare">Compare <b id="cmpCount"></b></a>
    <a href="#/settings" data-view="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span class="sr-only">Settings</span>
    </a>
  </nav>
</header>

<main id="app">
  <section id="view-catalog" class="view">
    <aside id="filters" class="filters" aria-label="Filters">
      <div class="filters-head">
        <h2>Filters</h2>
        <button class="link" id="resetFilters" type="button">Reset</button>
        <button class="icon close-drawer" id="closeFilters" type="button" aria-label="Close filters">×</button>
      </div>

      <div class="fgroup">
        <h3>Sort by</h3>
        <select id="sort">
          <option value="order">List order</option>
          <option value="diffPctDesc">Biggest saving vs eMag (%)</option>
          <option value="diffDesc">Biggest saving vs eMag (lei)</option>
          <option value="diffPctAsc">eMag cheapest first (%)</option>
          <option value="diffAsc">eMag cheapest first (lei)</option>
          <option value="priceAsc">List price, low to high</option>
          <option value="priceDesc">List price, high to low</option>
          <option value="emagAsc">eMag price, low to high</option>
          <option value="emagDesc">eMag price, high to low</option>
          <option value="nameAsc">Name, A to Z</option>
        </select>
      </div>

      <div class="fgroup">
        <h3>Tags <span class="hint">tap once to include, twice to exclude</span></h3>
        <div class="seg" role="radiogroup" aria-label="Tag match">
          <label><input type="radio" name="tagMode" value="any" checked> Any</label>
          <label><input type="radio" name="tagMode" value="all"> All</label>
        </div>
        <div id="tagChips" class="chips"></div>
        <details class="moretags">
          <summary>All tags</summary>
          <input id="tagSearch" type="search" placeholder="Find a tag">
          <div id="allTagChips" class="chips"></div>
        </details>
      </div>

      <div class="fgroup">
        <h3>Brand</h3>
        <input id="brand" list="brandList" placeholder="Any brand">
        <datalist id="brandList"></datalist>
      </div>

      <div class="fgroup">
        <h3>List price (lei)</h3>
        <div class="range"><input id="pMin" type="number" inputmode="decimal" placeholder="Min"><span>to</span><input id="pMax" type="number" inputmode="decimal" placeholder="Max"></div>
      </div>

      <div class="fgroup">
        <h3>Vs eMag</h3>
        <label class="check"><input type="checkbox" id="hasEmag"> Only items with an eMag price</label>
        <label class="check"><input type="checkbox" id="cheaper"> Only where my list is cheaper</label>
        <p class="sub">Saving %</p>
        <div class="range"><input id="dMin" type="number" inputmode="decimal" placeholder="Min %"><span>to</span><input id="dMax" type="number" inputmode="decimal" placeholder="Max %"></div>
        <p class="sub">Saving lei</p>
        <div class="range"><input id="lMin" type="number" inputmode="decimal" placeholder="Min"><span>to</span><input id="lMax" type="number" inputmode="decimal" placeholder="Max"></div>
      </div>

      <div class="fgroup">
        <h3>Wishlist</h3>
        <select id="inList"><option value="">Everything</option></select>
      </div>
    </aside>

    <div class="results">
      <div class="resultbar">
        <button class="btn ghost open-filters" id="openFilters" type="button">Filters <b id="activeCount"></b></button>
        <p id="count" aria-live="polite"></p>
        <button class="btn" id="batchFetch" type="button">Load eMag prices for these</button>
      </div>
      <div id="batchBar" class="batchbar" hidden>
        <div class="progress"><span id="batchFill"></span></div>
        <p id="batchText"></p>
        <button class="link" id="batchStop" type="button">Stop</button>
      </div>
      <div id="grid" class="grid"></div>
      <div id="sentinel" class="sentinel"></div>
      <p id="empty" class="empty" hidden>No products match these filters. Remove a tag or widen the price range.</p>
    </div>
  </section>

  <section id="view-wishlists" class="view" hidden></section>
  <section id="view-compare" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<div id="compareDock" class="dock" hidden>
  <div id="dockThumbs" class="dock-thumbs"></div>
  <a class="btn" href="#/compare">Compare <span id="dockN"></span></a>
  <button class="link" id="dockClear" type="button">Clear</button>
</div>

<dialog id="detail" class="sheet"></dialog>
<dialog id="pickList" class="sheet small"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<div id="loading" class="loading">
  <div class="tag-spin" aria-hidden="true"></div>
  <p>Loading…</p>
</div>

<script src="app.js" defer></script>
</body>
</html>
